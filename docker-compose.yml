services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fizrmm}
      POSTGRES_USER: ${POSTGRES_USER:-fizrmm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fizrmm-admin-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FIZRMM_HOST: 0.0.0.0
      FIZRMM_PORT: 8000
      FIZRMM_PUBLIC_URL: ${FIZRMM_PUBLIC_URL:-http://127.0.0.1:8000}
      FIZRMM_INTEGRATIONS_FILE: /runtime/fizrmm/integrations.json
      DATABASE_URL: ${DATABASE_URL:-postgresql://fizrmm_app:fizrmm-app-dev-password@postgres:5432/fizrmm}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-fizrmm}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      MESHCENTRAL_URL: ${MESHCENTRAL_URL:-}
      MESHCENTRAL_PUBLIC_URL: ${MESHCENTRAL_PUBLIC_URL:-}
      MESHCENTRAL_PUBLIC_PORT: ${MESHCENTRAL_PUBLIC_PORT:-8443}
      MESHCENTRAL_MESH_ID: ${MESHCENTRAL_MESH_ID:-}
      MESHCENTRAL_LINUX_INSECURE_TLS: ${MESHCENTRAL_LINUX_INSECURE_TLS:-true}
      FIZRMM_REQUIRE_MESHCENTRAL_AGENT: ${FIZRMM_REQUIRE_MESHCENTRAL_AGENT:-}
      MESHCENTRAL_AGENT_INSTALLER_URL: ${MESHCENTRAL_AGENT_INSTALLER_URL:-}
      MESHCENTRAL_AGENT_INSTALL_ARGS: ${MESHCENTRAL_AGENT_INSTALL_ARGS:-}
      MESHCENTRAL_LINUX_AGENT_INSTALLER_URL: ${MESHCENTRAL_LINUX_AGENT_INSTALLER_URL:-}
      MESHCENTRAL_LINUX_AGENT_INSTALL_ARGS: ${MESHCENTRAL_LINUX_AGENT_INSTALL_ARGS:-}
      ZABBIX_SERVER: ${ZABBIX_SERVER:-}
      ZABBIX_AGENT_INSTALLER_URL: ${ZABBIX_AGENT_INSTALLER_URL:-}
      ZABBIX_AGENT_INSTALL_ARGS: ${ZABBIX_AGENT_INSTALL_ARGS:-}
      ZABBIX_LINUX_AGENT_INSTALLER_URL: ${ZABBIX_LINUX_AGENT_INSTALLER_URL:-}
      ZABBIX_LINUX_AGENT_INSTALL_ARGS: ${ZABBIX_LINUX_AGENT_INSTALL_ARGS:-}
      WAZUH_MANAGER: ${WAZUH_MANAGER:-}
      WAZUH_AGENT_INSTALLER_URL: ${WAZUH_AGENT_INSTALLER_URL:-}
      WAZUH_AGENT_INSTALL_ARGS: ${WAZUH_AGENT_INSTALL_ARGS:-}
      WAZUH_LINUX_AGENT_INSTALLER_URL: ${WAZUH_LINUX_AGENT_INSTALLER_URL:-}
      WAZUH_LINUX_AGENT_INSTALL_ARGS: ${WAZUH_LINUX_AGENT_INSTALL_ARGS:-}
      SALT_MASTER: ${SALT_MASTER:-}
      SALT_MINION_INSTALLER_URL: ${SALT_MINION_INSTALLER_URL:-}
      SALT_MINION_INSTALL_ARGS: ${SALT_MINION_INSTALL_ARGS:-}
      SALT_LINUX_MINION_INSTALLER_URL: ${SALT_LINUX_MINION_INSTALLER_URL:-}
      SALT_LINUX_MINION_INSTALL_ARGS: ${SALT_LINUX_MINION_INSTALL_ARGS:-}
    ports:
      - "8000:8000"
    volumes:
      - runtime_config:/runtime/fizrmm:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 5

  portal:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_FIZRMM_API_BASE: ${FIZRMM_API_BASE:-}
      VITE_DEV_PROXY_TARGET: ${FIZRMM_DEV_PROXY_TARGET:-http://api:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      api:
        condition: service_healthy

  keycloak:
    profiles: ["integrations"]
    image: quay.io/keycloak/keycloak:latest
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-password}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  nats:
    profiles: ["integrations"]
    image: nats:latest
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  opensearch:
    profiles: ["integrations"]
    image: opensearchproject/opensearch:latest
    environment:
      discovery.type: single-node
      plugins.security.disabled: "false"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-FizRMM-dev-password-1!}
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  meshcentral:
    profiles: ["integrations"]
    image: ghcr.io/ylianst/meshcentral:latest
    environment:
      HOSTNAME: ${MESHCENTRAL_HOSTNAME:-meshcentral}
      REVERSE_PROXY: "false"
    ports:
      - "8443:443"
    volumes:
      - meshcentral_data:/opt/meshcentral/meshcentral-data
      - meshcentral_files:/opt/meshcentral/meshcentral-files

  salt-master:
    profiles: ["integrations"]
    image: saltstack/salt:latest
    command: ["salt-master", "--config-dir=/etc/salt", "--log-level=info"]
    ports:
      - "4505:4505"
      - "4506:4506"
    volumes:
      - ./deploy/salt/master:/etc/salt/master:ro
      - salt_pki:/etc/salt/pki
      - salt_cache:/var/cache/salt
      - salt_srv:/srv/salt
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 4505), 2); s.close()"
      interval: 10s
      timeout: 5s
      retries: 12

  zabbix-postgres:
    profiles: ["integrations"]
    image: postgres:18
    environment:
      POSTGRES_DB: ${ZABBIX_POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${ZABBIX_POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_POSTGRES_PASSWORD:-zabbix-dev-password}
    volumes:
      - zabbix_postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zabbix-server:
    profiles: ["integrations"]
    image: zabbix/zabbix-server-pgsql:alpine-latest
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_DB: ${ZABBIX_POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${ZABBIX_POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_POSTGRES_PASSWORD:-zabbix-dev-password}
    ports:
      - "10051:10051"
    depends_on:
      zabbix-postgres:
        condition: service_healthy

  zabbix-web:
    profiles: ["integrations"]
    image: zabbix/zabbix-web-nginx-pgsql:alpine-latest
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_DB: ${ZABBIX_POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${ZABBIX_POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_POSTGRES_PASSWORD:-zabbix-dev-password}
    ports:
      - "8081:8080"
    depends_on:
      - zabbix-server

  wazuh-manager:
    profiles: ["integrations"]
    image: wazuh/wazuh-manager:${WAZUH_MANAGER_VERSION:-4.14.5}
    hostname: wazuh-manager
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    volumes:
      - wazuh_manager_data:/var/ossec/data

  fizrmm-init:
    profiles: ["integrations"]
    image: python:3.13-slim
    working_dir: /init
    command: ["python", "/init/init.py"]
    environment:
      FIZRMM_INIT_CONFIG: /init/config.json
      FIZRMM_INTEGRATIONS_FILE: /runtime/fizrmm/integrations.json
      FIZRMM_INIT_WAIT_TIMEOUT: ${FIZRMM_INIT_WAIT_TIMEOUT:-180}
      FIZRMM_INIT_WAIT_SERVICES: ${FIZRMM_INIT_WAIT_SERVICES:-keycloak,nats,meshcentral,salt,zabbix,wazuh,opensearch}
      FIZRMM_INIT_REQUIRED_SERVICES: ${FIZRMM_INIT_REQUIRED_SERVICES:-keycloak,nats,meshcentral,salt,zabbix,wazuh,opensearch}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-password}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-fizrmm}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-fizrmm-portal}
      FIZRMM_DEMO_ADMIN_USER: ${FIZRMM_DEMO_ADMIN_USER:-demo-admin}
      FIZRMM_DEMO_ADMIN_PASSWORD: ${FIZRMM_DEMO_ADMIN_PASSWORD:-demo-admin-password}
      FIZRMM_DEMO_TECH_USER: ${FIZRMM_DEMO_TECH_USER:-demo-tech}
      FIZRMM_DEMO_TECH_PASSWORD: ${FIZRMM_DEMO_TECH_PASSWORD:-demo-tech-password}
    volumes:
      - ./deploy/init:/init:ro
      - runtime_config:/runtime/fizrmm
    depends_on:
      - keycloak
      - nats
      - meshcentral
      - salt-master
      - zabbix-web
      - wazuh-manager
      - opensearch

volumes:
  postgres18_data:
  opensearch_data:
  runtime_config:
  frontend_node_modules:
  meshcentral_data:
  meshcentral_files:
  salt_pki:
  salt_cache:
  salt_srv:
  zabbix_postgres18_data:
  wazuh_manager_data:
